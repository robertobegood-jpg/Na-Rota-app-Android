name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Republicar o release desta tag (ex.: v0.1.0). Deixe vazio para só compilar."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Versão
        id: v
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$GITHUB_REF_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo (otimizador, dados, Pix)
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle.log; then
            # Mostra o motivo da falha nas anotações (visíveis sem login)
            msg=$(grep -E -A12 'What went wrong|FAILED|^e: |Exception' gradle.log | head -80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha no Gradle::$msg"
            exit 1
          fi

      - name: APK de teste (debug)
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle.log; then
            # Mostra o motivo da falha nas anotações (visíveis sem login)
            msg=$(grep -E -A12 'What went wrong|FAILED|^e: |Exception' gradle.log | head -80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha no Gradle::$msg"
            exit 1
          fi

      - name: Preparar assinatura
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK assinado (release)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle.log; then
            # Mostra o motivo da falha nas anotações (visíveis sem login)
            msg=$(grep -E -A12 'What went wrong|FAILED|^e: |Exception' gradle.log | head -80 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Falha no Gradle::$msg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: na-rota-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Nomear APK como nos outros apps
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        run: cp app/build/outputs/apk/release/app-release.apk "NaRota-${{ steps.v.outputs.tag }}.apk"

      - name: Publicar release (tags v*)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Na Rota ${{ steps.v.outputs.tag }}
          files: NaRota-${{ steps.v.outputs.tag }}.apk
